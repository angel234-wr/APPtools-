  &lt;!-- Main Workspace --&gt;
  &lt;main class=&quot;max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-8&quot;&gt;

    &lt;!-- Quick Summary Strip --&gt;

      &lt;/div&gt;
      &lt;div class=&quot;bg-white rounded-2xl border border-slate-200 p-4 shadow-sm&quot;&gt;
        &lt;p class=&quot;text-xs font-medium text-slate-500 uppercase tracking-wider&quot;&gt;Current Score&lt;/p&gt;
        &lt;p id=&quot;summary-score&quot; class=&quot;mt-1 text-sm sm:text-base font-bold text-blue-800&quot;&gt;0 / 20 pts (0%)&lt;/p&gt;
        &lt;p id=&quot;summary-level&quot; class=&quot;text-xs text-slate-500 mt-0.5&quot;&gt;Pending evaluation&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;bg-white rounded-2xl border border-slate-200 p-4 shadow-sm&quot;&gt;
        &lt;p class=&quot;text-xs font-medium text-slate-500 uppercase tracking-wider&quot;&gt;Saved Assessments&lt;/p&gt;
        &lt;p id=&quot;summary-saved-count&quot; class=&quot;mt-1 text-sm sm:text-base font-bold text-slate-900&quot;&gt;0 records&lt;/p&gt;
        &lt;p class=&quot;text-xs text-slate-500 mt-0.5&quot;&gt;In-session history ready&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;!-- ===================================================================== --&gt;
    &lt;!-- SECTION A: CREATE AN ASSESSMENT INSTRUMENT                            --&gt;
    &lt;!-- ===================================================================== --&gt;
    &lt;section id=&quot;section-generator&quot; class=&quot;bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden&quot;&gt;
      &lt;div class=&quot;bg-gradient-to-r from-blue-900 to-blue-700 px-6 py-5 text-white&quot;&gt;
        &lt;div class=&quot;flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2&quot;&gt;
          &lt;div&gt;
            &lt;span class=&quot;inline-block text-xs font-semibold uppercase tracking-wider bg-white/15 px-2.5 py-0.5 rounded-full mb-1.5&quot;&gt;
              Section A · Instrument Designer
            &lt;/span&gt;
            &lt;h2 class=&quot;text-xl sm:text-2xl font-bold&quot;&gt;Create an Assessment Instrument&lt;/h2&gt;
            &lt;p class=&quot;text-sm text-blue-100 mt-1&quot;&gt;
              Define your classroom activity, CEFR level, and criteria to build a fair, observable assessment tool.
            &lt;/p&gt;
          &lt;/div&gt;
          &lt;button
            type=&quot;button&quot;
            onclick=&quot;loadSampleRoutineData()&quot;
            class=&quot;self-start sm:self-center bg-white text-blue-900 hover:bg-blue-50 font-semibold text-xs sm:text-sm px-4 py-2.5 rounded-xl transition-colors shadow-sm shrink-0 no-print&quot;
          &gt;
            Load Sample: &quot;My Daily Routine&quot; (A2)
          &lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;p-6 space-y-6&quot;&gt;
        &lt;!-- Validation Error Box for Generator --&gt;
        &lt;div id=&quot;generator-errors&quot; role=&quot;alert&quot; class=&quot;hidden rounded-xl bg-red-50 border border-red-200 p-4 text-sm text-red-800 no-print&quot;&gt;
          &lt;p class=&quot;font-semibold mb-1&quot;&gt;Please review the following required fields:&lt;/p&gt;
          &lt;ul id=&quot;generator-error-list&quot; class=&quot;list-disc list-inside space-y-0.5&quot;&gt;&lt;/ul&gt;
        &lt;/div&gt;

        &lt;form id=&quot;instrument-form&quot; onsubmit=&quot;handleGenerateInstrument(event)&quot; class=&quot;space-y-5 no-print&quot; novalidate&gt;
          &lt;div class=&quot;grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5&quot;&gt;
            &lt;!-- Assessment Title --&gt;
            &lt;div class=&quot;md:col-span-2 lg:col-span-1&quot;&gt;
              &lt;label for=&quot;inst-title&quot; class=&quot;block text-sm font-semibold text-slate-800 mb-1.5&quot;&gt;
                Assessment Title &lt;span class=&quot;text-red-600&quot;&gt;*&lt;/span&gt;
              &lt;/label&gt;
              &lt;input
                type=&quot;text&quot;
                id=&quot;inst-title&quot;
                name=&quot;inst-title&quot;
                required
                placeholder=&quot;e.g., My Daily Routine&quot;
                class=&quot;w-full rounded-xl border border-slate-300 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 focus:bg-white focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-200&quot;
              /&gt;
            &lt;/div&gt;

            &lt;!-- Student Level (CEFR) --&gt;
            &lt;div&gt;
              &lt;label for=&quot;inst-level&quot; class=&quot;block text-sm font-semibold text-slate-800 mb-1.5&quot;&gt;
                Student CEFR Level &lt;span class=&quot;text-red-600&quot;&gt;*&lt;/span&gt;
              &lt;/label&gt;
              &lt;select
                id=&quot;inst-level&quot;
                name=&quot;inst-level&quot;
                required
                class=&quot;w-full rounded-xl border border-slate-300 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 focus:bg-white focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-200&quot;
              &gt;
                &lt;option value=&quot;A1&quot;&gt;A1 – Beginner&lt;/option&gt;
                &lt;option value=&quot;A2&quot; selected&gt;A2 – Elementary&lt;/option&gt;
                &lt;option value=&quot;B1&quot;&gt;B1 – Intermediate&lt;/option&gt;
                &lt;option value=&quot;B2&quot;&gt;B2 – Upper-Intermediate&lt;/option&gt;
                &lt;option value=&quot;C1&quot;&gt;C1 – Advanced&lt;/option&gt;
                &lt;option value=&quot;C2&quot;&gt;C2 – Proficiency&lt;/option&gt;
              &lt;/select&gt;
            &lt;/div&gt;

            &lt;!-- Student Age or Grade --&gt;
            &lt;div&gt;
              &lt;label for=&quot;inst-grade&quot; class=&quot;block text-sm font-semibold text-slate-800 mb-1.5&quot;&gt;
                Student Age or Grade &lt;span class=&quot;text-red-600&quot;&gt;*&lt;/span&gt;
              &lt;/label&gt;
              &lt;input
                type=&quot;text&quot;
                id=&quot;inst-grade&quot;
                name=&quot;inst-grade&quot;
                required
                placeholder=&quot;e.g., 11–13 years / Grade 6&quot;
                class=&quot;w-full rounded-xl border border-slate-300 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 focus:bg-white focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-200&quot;
              /&gt;
            &lt;/div&gt;

            &lt;!-- English Skill --&gt;
            &lt;div&gt;
              &lt;label for=&quot;inst-skill&quot; class=&quot;block text-sm font-semibold text-slate-800 mb-1.5&quot;&gt;
                Primary English Skill &lt;span class=&quot;text-red-600&quot;&gt;*&lt;/span&gt;
              &lt;/label&gt;
              &lt;select
                id=&quot;inst-skill&quot;
                name=&quot;inst-skill&quot;
                required
                class=&quot;w-full rounded-xl border border-slate-300 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 focus:bg-white focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-200&quot;
              &gt;
                &lt;option value=&quot;Speaking&quot; selected&gt;Speaking&lt;/option&gt;
                &lt;option value=&quot;Listening&quot;&gt;Listening&lt;/option&gt;
                &lt;option value=&quot;Reading&quot;&gt;Reading&lt;/option&gt;
                &lt;option value=&quot;Writing&quot;&gt;Writing&lt;/option&gt;
                &lt;option value=&quot;Grammar&quot;&gt;Grammar&lt;/option&gt;
                &lt;option value=&quot;Vocabulary&quot;&gt;Vocabulary&lt;/option&gt;
              &lt;/select&gt;
            &lt;/div&gt;

            &lt;!-- Assessment Type --&gt;
            &lt;div&gt;
              &lt;label for=&quot;inst-type&quot; class=&quot;block text-sm font-semibold text-slate-800 mb-1.5&quot;&gt;
                Assessment Type &lt;span class=&quot;text-red-600&quot;&gt;*&lt;/span&gt;
              &lt;/label&gt;
              &lt;select
                id=&quot;inst-type&quot;
                name=&quot;inst-type&quot;
                required
                class=&quot;w-full rounded-xl border border-slate-300 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 focus:bg-white focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-200&quot;
              &gt;
                &lt;option value=&quot;Rubric&quot; selected&gt;Rubric (4-Level Performance Scale)&lt;/option&gt;
                &lt;option value=&quot;Checklist&quot;&gt;Checklist (Observable Criteria)&lt;/option&gt;
                &lt;option value=&quot;Rating Scale&quot;&gt;Rating Scale (1–4 Scale)&lt;/option&gt;
                &lt;option value=&quot;Quiz&quot;&gt;Quiz / Structured Task&lt;/option&gt;
                &lt;option value=&quot;Observation Form&quot;&gt;Observation Form&lt;/option&gt;
              &lt;/select&gt;
            &lt;/div&gt;

            &lt;!-- Total Possible Points --&gt;
            &lt;div&gt;
              &lt;label for=&quot;inst-total-points&quot; class=&quot;block text-sm font-semibold text-slate-800 mb-1.5&quot;&gt;
                Total Possible Points &lt;span class=&quot;text-red-600&quot;&gt;*&lt;/span&gt;
              &lt;/label&gt;
              &lt;input
                type=&quot;number&quot;
                id=&quot;inst-total-points&quot;
                name=&quot;inst-total-points&quot;
                min=&quot;1&quot;
                max=&quot;500&quot;
                step=&quot;1&quot;
                value=&quot;20&quot;
                required
                class=&quot;w-full rounded-xl border border-slate-300 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 focus:bg-white focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-200&quot;
              /&gt;
              &lt;p class=&quot;text-xs text-slate-500 mt-1&quot;&gt;
                Points are distributed evenly across your criteria (and reflected in the maximum score).
              &lt;/p&gt;
            &lt;/div&gt;
          &lt;/div&gt;

          &lt;!-- Assessment Activity or Assignment --&gt;
          &lt;div&gt;
            &lt;label for=&quot;inst-activity&quot; class=&quot;block text-sm font-semibold text-slate-800 mb-1.5&quot;&gt;
              Assessment Activity or Assignment &lt;span class=&quot;text-red-600&quot;&gt;*&lt;/span&gt;
            &lt;/label&gt;
            &lt;input
              type=&quot;text&quot;
              id=&quot;inst-activity&quot;
              name=&quot;inst-activity&quot;
              required
              placeholder=&quot;e.g., 1–2 minute individual oral presentation talking about weekday and weekend routines&quot;
              class=&quot;w-full rounded-xl border border-slate-300 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 focus:bg-white focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-200&quot;
            /&gt;
          &lt;/div&gt;

          &lt;!-- Learning Objective --&gt;
          &lt;div&gt;
            &lt;label for=&quot;inst-objective&quot; class=&quot;block text-sm font-semibold text-slate-800 mb-1.5&quot;&gt;
              Learning Objective &lt;span class=&quot;text-red-600&quot;&gt;*&lt;/span&gt;
            &lt;/label&gt;
            &lt;textarea
              id=&quot;inst-objective&quot;
              name=&quot;inst-objective&quot;
              rows=&quot;2&quot;
              required
              placeholder=&quot;e.g., Students can describe their typical daily routine using at least five routine verbs and appropriate time expressions.&quot;
              class=&quot;w-full rounded-xl border border-slate-300 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 focus:bg-white focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-200&quot;
            &gt;&lt;/textarea&gt;
          &lt;/div&gt;

          &lt;!-- Assessment Criteria --&gt;
          &lt;div&gt;
            &lt;div class=&quot;flex flex-col sm:flex-row sm:items-center sm:justify-between gap-1 mb-1.5&quot;&gt;
              &lt;label for=&quot;inst-criteria&quot; class=&quot;block text-sm font-semibold text-slate-800&quot;&gt;
                Assessment Criteria (one per line) &lt;span class=&quot;text-red-600&quot;&gt;*&lt;/span&gt;
              &lt;/label&gt;
              &lt;span class=&quot;text-xs text-slate-500&quot;&gt;Each line becomes an evaluable criterion&lt;/span&gt;
            &lt;/div&gt;
            &lt;textarea
              id=&quot;inst-criteria&quot;
              name=&quot;inst-criteria&quot;
              rows=&quot;5&quot;
              required
              placeholder=&quot;Use of routine vocabulary&amp;#10;Use of time expressions&amp;#10;Grammar accuracy&amp;#10;Pronunciation and intelligibility&amp;#10;Fluency and organization&quot;
              class=&quot;w-full rounded-xl border border-slate-300 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900 font-mono focus:bg-white focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-200&quot;
            &gt;&lt;/textarea&gt;
          &lt;/div&gt;

          &lt;!-- Action Buttons --&gt;
          &lt;div class=&quot;flex flex-wrap items-center gap-3 pt-2&quot;&gt;
            &lt;button
              type=&quot;submit&quot;
              class=&quot;bg-blue-700 hover:bg-blue-800 text-white font-semibold text-sm px-5 py-3 rounded-xl shadow-sm transition-colors flex items-center gap-2&quot;
            &gt;
              &lt;span&gt;Generate Instrument&lt;/span&gt;
            &lt;/button&gt;
            &lt;button
              type=&quot;button&quot;
              onclick=&quot;clearGeneratorForm()&quot;
              class=&quot;bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 font-medium text-sm px-4 py-3 rounded-xl transition-colors&quot;
            &gt;
              Clear Form
            &lt;/button&gt;
            &lt;button
              type=&quot;button&quot;
              onclick=&quot;navigateToSection(&#39;section-evaluator&#39;)&quot;
              class=&quot;bg-blue-50 hover:bg-blue-100 text-blue-800 font-medium text-sm px-4 py-3 rounded-xl transition-colors&quot;
            &gt;
              Proceed to Evaluation →
            &lt;/button&gt;
          &lt;/div&gt;
        &lt;/form&gt;

        &lt;!-- Generated Classroom-Ready Instrument Preview --&gt;
        &lt;div id=&quot;generated-instrument-box&quot; class=&quot;border-t border-slate-200 pt-6&quot;&gt;
          &lt;div class=&quot;flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 mb-4&quot;&gt;
            &lt;div&gt;
              &lt;span class=&quot;text-xs font-bold uppercase tracking-wider text-blue-700&quot;&gt;
                Classroom-Ready Instrument Blueprint
              &lt;/span&gt;
              &lt;h3 id=&quot;gen-title-display&quot; class=&quot;text-lg sm:text-xl font-bold text-slate-900&quot;&gt;
                My Daily Routine
              &lt;/h3&gt;
            &lt;/div&gt;
            &lt;span id=&quot;gen-badge-display&quot; class=&quot;self-start sm:self-center inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-800&quot;&gt;
              A2 · Speaking · Rubric · 20 Points
            &lt;/span&gt;
          &lt;/div&gt;

          &lt;div class=&quot;grid grid-cols-1 lg:grid-cols-2 gap-4 text-sm&quot;&gt;
            &lt;!-- 1 &amp; 2: Title &amp; Purpose --&gt;
            &lt;div class=&quot;rounded-xl bg-slate-50 border border-slate-200 p-4&quot;&gt;
              &lt;h4 class=&quot;font-bold text-slate-900 mb-1&quot;&gt;1. Title &amp;amp; 2. Assessment Purpose&lt;/h4&gt;
              &lt;p id=&quot;gen-purpose&quot; class=&quot;text-slate-700 leading-relaxed&quot;&gt;&lt;/p&gt;
            &lt;/div&gt;

            &lt;!-- 3: Learning Objective --&gt;
            &lt;div class=&quot;rounded-xl bg-slate-50 border border-slate-200 p-4&quot;&gt;
              &lt;h4 class=&quot;font-bold text-slate-900 mb-1&quot;&gt;3. Learning Objective&lt;/h4&gt;
              &lt;p id=&quot;gen-objective&quot; class=&quot;text-slate-700 leading-relaxed&quot;&gt;&lt;/p&gt;
            &lt;/div&gt;

            &lt;!-- 4: Instructions for Students --&gt;
            &lt;div class=&quot;rounded-xl bg-blue-50/60 border border-blue-200 p-4&quot;&gt;
              &lt;h4 class=&quot;font-bold text-blue-950 mb-1&quot;&gt;4. Instructions for Students&lt;/h4&gt;
              &lt;p id=&quot;gen-student-instructions&quot; class=&quot;text-slate-700 leading-relaxed&quot;&gt;&lt;/p&gt;
            &lt;/div&gt;

            &lt;!-- 5: Instructions for the Teacher --&gt;
            &lt;div class=&quot;rounded-xl bg-slate-50 border border-slate-200 p-4&quot;&gt;
              &lt;h4 class=&quot;font-bold text-slate-900 mb-1&quot;&gt;5. Instructions for the Teacher&lt;/h4&gt;
              &lt;p id=&quot;gen-teacher-instructions&quot; class=&quot;text-slate-700 leading-relaxed&quot;&gt;&lt;/p&gt;
            &lt;/div&gt;
          &lt;/div&gt;

          &lt;!-- 6, 7, 8: Criteria, Performance Levels &amp; Point Values --&gt;
          &lt;div class=&quot;mt-4 rounded-xl border border-slate-200 overflow-hidden&quot;&gt;
            &lt;div class=&quot;bg-slate-100 px-4 py-2.5 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2&quot;&gt;
              &lt;h4 id=&quot;gen-criteria-heading&quot; class=&quot;font-bold text-sm text-slate-900&quot;&gt;
                6. Assessment Criteria, 7. Performance Levels &amp;amp; 8. Point Values
              &lt;/h4&gt;
              &lt;span id=&quot;gen-points-breakdown&quot; class=&quot;text-xs font-semibold text-blue-800&quot;&gt;&lt;/span&gt;
            &lt;/div&gt;
            &lt;div id=&quot;gen-instrument-body&quot; class=&quot;bg-white&quot;&gt;
              &lt;!-- Populated dynamically based on assessment type --&gt;
            &lt;/div&gt;
          &lt;/div&gt;

          &lt;!-- 9 &amp; 10: Scoring Instructions &amp; Feedback Section --&gt;
          &lt;div class=&quot;mt-4 grid grid-cols-1 md:grid-cols-2 gap-4 text-sm&quot;&gt;
            &lt;div class=&quot;rounded-xl bg-slate-50 border border-slate-200 p-4&quot;&gt;
              &lt;h4 class=&quot;font-bold text-slate-900 mb-1&quot;&gt;9. Scoring Instructions&lt;/h4&gt;
              &lt;p id=&quot;gen-scoring-instructions&quot; class=&quot;text-slate-700 leading-relaxed&quot;&gt;&lt;/p&gt;
            &lt;/div&gt;
            &lt;div class=&quot;rounded-xl bg-slate-50 border border-slate-200 p-4&quot;&gt;
              &lt;h4 class=&quot;font-bold text-slate-900 mb-1&quot;&gt;10. Feedback Section Structure&lt;/h4&gt;
              &lt;p id=&quot;gen-feedback-structure&quot; class=&quot;text-slate-700 leading-relaxed&quot;&gt;&lt;/p&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;!-- ===================================================================== --&gt;
    &lt;!-- SECTION B: INTERACTIVE ASSESSMENT                                     --&gt;
    &lt;!-- ===================================================================== --&gt;
    &lt;section id=&quot;section-evaluator&quot; class=&quot;bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden&quot;&gt;
      &lt;div class=&quot;bg-gradient-to-r from-blue-800 to-blue-600 px-6 py-5 text-white&quot;&gt;
        &lt;span class=&quot;inline-block text-xs font-semibold uppercase tracking-wider bg-white/15 px-2.5 py-0.5 rounded-full mb-1.5&quot;&gt;
          Section B · Live Scoring &amp;amp; Observation
        &lt;/span&gt;
        &lt;h2 class=&quot;text-xl sm:text-2xl font-bold&quot;&gt;Interactive Student Assessment&lt;/h2&gt;
        &lt;p class=&quot;text-sm text-blue-100 mt-1&quot;&gt;
          Select a performance level (1–4) for each criterion and add notes. Scores calculate automatically.
        &lt;/p&gt;
      &lt;/div&gt;

      &lt;div class=&quot;p-6 space-y-6&quot;&gt;
        &lt;!-- Validation Errors for Evaluation --&gt;
        &lt;div id=&quot;evaluator-errors&quot; role=&quot;alert&quot; class=&quot;hidden rounded-xl bg-red-50 border border-red-200 p-4 text-sm text-red-800 no-print&quot;&gt;
          &lt;p class=&quot;font-semibold mb-1&quot;&gt;Cannot complete assessment yet:&lt;/p&gt;
          &lt;ul id=&quot;evaluator-error-list&quot; class=&quot;list-disc list-inside space-y-0.5&quot;&gt;&lt;/ul&gt;
        &lt;/div&gt;

        &lt;!-- Student &amp; Instrument Header Controls --&gt;
        &lt;div class=&quot;grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-50 border border-slate-200 rounded-2xl p-4 no-print&quot;&gt;
          &lt;div&gt;
            &lt;label for=&quot;eval-student-name&quot; class=&quot;block text-sm font-semibold text-slate-800 mb-1.5&quot;&gt;
              Student Name &lt;span class=&quot;text-red-600&quot;&gt;*&lt;/span&gt;
            &lt;/label&gt;
            &lt;input
              type=&quot;text&quot;
              id=&quot;eval-student-name&quot;
              placeholder=&quot;e.g., Sofia Mendoza&quot;

  &lt;script&gt;
    /**
     * =========================================================================
     * APPLICATION STATE &amp; SAMPLE DATA
     * =========================================================================
     */
    const LEVEL_LABELS = {
      4: &#39;Excellent&#39;,
      3: &#39;Good&#39;,
      2: &#39;Developing&#39;,
      1: &#39;Beginning&#39;
    };

    const RATING_SCALE_LABELS = {
      4: &#39;Always / Strong (4)&#39;,
      3: &#39;Often / Clear (3)&#39;,
      2: &#39;Sometimes / Partial (2)&#39;,
      1: &#39;Rarely / Minimal (1)&#39;
    };

    const SAMPLE_INSTRUMENT = {
      id: &#39;sample-daily-routine-a2&#39;,
      title: &#39;My Daily Routine&#39;,
      level: &#39;A2&#39;,
      grade: &#39;Grade 6 (11–12 years)&#39;,
      skill: &#39;Speaking&#39;,
      activity: &#39;Short individual speaking task (1–2 minutes) describing a typical weekday and/or weekend routine.&#39;,
      objective: &#39;Students can describe their typical daily routine using at least five routine verbs and appropriate time expressions.&#39;,
      type: &#39;Rubric&#39;,
      totalPoints: 20,
      criteriaNames: [
        &#39;Use of routine vocabulary&#39;,
        &#39;Use of time expressions&#39;,
        &#39;Grammar accuracy&#39;,
        &#39;Pronunciation and intelligibility&#39;,
        &#39;Fluency and organization&#39;
      ]
    };

    const appState = {
      instruments: [],
      activeInstrumentId: null,
      evaluations: {}, // Map of criterionId -&gt; { score: number|null, comment: string }
      savedRecords: [],
      editingRecordId: null
    };

    /**
     * =========================================================================
     * INITIALIZATION
     * =========================================================================
     */
    window.addEventListener(&#39;DOMContentLoaded&#39;, () =&gt; {
      try {
        const today = new Date().toISOString().split(&#39;T&#39;)[0];
        const dateInput = document.getElementById(&#39;eval-date&#39;);
        if (dateInput) dateInput.value = today;

        // Seed the required A2 &quot;My Daily Routine&quot; sample instrument
        const sample = buildInstrumentObject(SAMPLE_INSTRUMENT);
        appState.instruments.push(sample);
        appState.activeInstrumentId = sample.id;

        populateFormFromInstrument(sample);
        renderGeneratedInstrument(sample);
        refreshInstrumentDropdown();
        renderEvaluationCriteria(sample);
        recalculateScores();
        regenerateFeedbackFromCurrentScores();
        syncReportToCurrentState();
        updateLiveSummary();
      } catch (err) {
        console.error(&#39;Initialization error:&#39;, err);
        showBanner(&#39;There was an issue initializing the workspace. Please refresh the page.&#39;, &#39;error&#39;);
      }
    });

    /**
     * =========================================================================
     * NAVIGATION &amp; UI HELPERS
     * =========================================================================
     */
    function navigateToSection(sectionId) {
      const target = document.getElementById(sectionId);
      if (!target) return;

      document.querySelectorAll(&#39;.nav-btn&#39;).forEach((btn) =&gt; {
        const isActive = btn.getAttribute(&#39;data-nav&#39;) === sectionId;
        if (isActive) {
          btn.className = &#39;nav-btn px-3 py-2 rounded-lg text-xs sm:text-sm font-medium transition-colors bg-blue-700 text-white&#39;;
        } else {

    function handleGenerateInstrument(event) {
      event.preventDefault();
      try {
        const title = document.getElementById(&#39;inst-title&#39;).value.trim();
        const level = document.getElementById(&#39;inst-level&#39;).value.trim();
        const grade = document.getElementById(&#39;inst-grade&#39;).value.trim();
        const skill = document.getElementById(&#39;inst-skill&#39;).value.trim();
        const type = document.getElementById(&#39;inst-type&#39;).value.trim();
        const rawPoints = Number(document.getElementById(&#39;inst-total-points&#39;).value);
        const activity = document.getElementById(&#39;inst-activity&#39;).value.trim();
        const objective = document.getElementById(&#39;inst-objective&#39;).value.trim();
        const rawCriteria = document.getElementById(&#39;inst-criteria&#39;).value
          .split(&#39;\n&#39;)
          .map((line) =&gt; line.trim())
          .filter((line) =&gt; line.length &gt; 0);

        const errors = [];
        if (!title) errors.push(&#39;Assessment Title is required.&#39;);
        if (!level) errors.push(&#39;Student CEFR Level is required.&#39;);
        if (!grade) errors.push(&#39;Student Age or Grade is required.&#39;);
        if (!skill) errors.push(&#39;Primary English Skill is required.&#39;);
        if (!activity) errors.push(&#39;Assessment Activity or Assignment is required.&#39;);
        if (!objective) errors.push(&#39;Learning Objective is required.&#39;);
        if (rawCriteria.length === 0) errors.push(&#39;Please enter at least one Assessment Criterion.&#39;);
        if (!Number.isFinite(rawPoints) || rawPoints &lt;= 0) {
          errors.push(&#39;Total Possible Points must be a positive number greater than 0.&#39;);
        }

        if (errors.length &gt; 0) {
          showValidationErrors(&#39;generator-errors&#39;, &#39;generator-error-list&#39;, errors);
          return;
        }

        hideValidationErrors(&#39;generator-errors&#39;);

        const newInst = buildInstrumentObject({
          id: &#39;inst-&#39; + Date.now(),
          title,
          level,
          grade,
          skill,
          activity,
          objective,
          type,
          totalPoints: Math.round(rawPoints),
          criteriaNames: rawCriteria
        });

        appState.instruments.unshift(newInst);
        appState.activeInstrumentId = newInst.id;
        appState.evaluations = {};

        renderGeneratedInstrument(newInst);
        refreshInstrumentDropdown();
        renderEvaluationCriteria(newInst);
        recalculateScores();
        regenerateFeedbackFromCurrentScores();
        syncReportToCurrentState();
        updateLiveSummary();

        showBanner(`Generated &quot;${newInst.title}&quot; (${newInst.totalPoints} points across ${newInst.criteria.length} criteria).`, &#39;success&#39;);
      } catch (err) {
        console.error(&#39;Error generating instrument:&#39;, err);
        showBanner(&#39;An error occurred while generating the instrument.&#39;, &#39;error&#39;);
      }
    }

    /**
     * Builds a complete instrument object with level-appropriate observable descriptors
     * and clean point distribution across criteria, tailored to the chosen assessment type.
     */
    function buildInstrumentObject({ id, title, level, grade, skill, activity, objective, type, totalPoints, criteriaNames }) {
      const count = criteriaNames.length;
      const basePts = Math.floor(totalPoints / count);
      const remainder = totalPoints % count;

      const criteria = criteriaNames.map((name, idx) =&gt; {
        // Assign remainder points to the first criteria so total equals exact totalPoints
        const maxPoints = Math.max(1, basePts + (idx &lt; remainder ? 1 : 0));
        const descriptors = generateDescriptorsForCriterion(name, level, skill);
        const checklistPrompt = `Demonstrates observable ${name.toLowerCase()} aligned with ${level} expectations during &quot;${activity}&quot;.`;
        const observationPrompt = `Record concrete ${skill.toLowerCase()} behaviors, student examples, or interaction cues for &quot;${name}&quot;.`;
        const quizQuestion = buildQuizPromptForCriterion(name, level, skill, maxPoints);
        return {
          id: `${id}-crit-${idx}`,
          name,
          maxPoints,
          descriptors,
          checklistPrompt,
          observationPrompt,
          quizQuestion
        };
      });

      const actualMaxPoints = criteria.reduce((sum, c) =&gt; sum + c.maxPoints, 0);

      const purpose = `Evaluate ${level} (${grade}) learners&#39; ${skill.toLowerCase()} performance during &quot;${activity}&quot; using a ${type.toLowerCase()} format aligned with the stated learning objective.`;

      const studentInstructions = `Complete &quot;${activity}&quot; in English at a ${level} level. Focus on the learning objective: &quot;${objective}&quot; Review each item below so you know what is expected during the task.`;

      const teacherInstructions = getTeacherInstructionsByType(type, activity, level, actualMaxPoints);

      const scoringInstructions = getScoringInstructionsByType(type, actualMaxPoints, criteria.length);

      const feedbackStructure = `Provide (1) specific strengths observed in the task, (2) priority areas for improvement tied to the criteria, (3) one practical next-step activity suitable for ${level} learners, and (4) an encouraging closing note.`;

      return {
        id,
        title,
        level,
        grade,
        skill,
        activity,
        objective,
        type,
        totalPoints: actualMaxPoints,
        criteria,
        purpose,
        studentInstructions,
        teacherInstructions,
        scoringInstructions,
        feedbackStructure
      };
    }

    function buildQuizPromptForCriterion(name, level, skill, maxPoints) {
      return `Task/Item (${maxPoints} pts): Assess student mastery of &quot;${name}&quot; at ${level} ${skill.toLowerCase()} level with a clear, unambiguous response or item set.`;
    }

    function getTeacherInstructionsByType(type, activity, level, totalPoints) {
      switch (type) {
        case &#39;Checklist&#39;:
          return `Observe &quot;${activity}&quot; at ${level} level and mark whether each criterion is Met (full points) or Not Yet Met (0 points). Total possible score is ${totalPoints} points.`;
        case &#39;Rating Scale&#39;:
          return `Rate each criterion on a 1–4 frequency/quality scale (4 = Always/Strong, 3 = Often/Clear, 2 = Sometimes/Partial, 1 = Rarely/Minimal) during &quot;${activity}&quot; for ${level} learners.`;
        case &#39;Quiz&#39;:
          return `Score each criterion/item block up to its assigned point value based on accuracy and task completion at ${level} level (total: ${totalPoints} points).`;
        case &#39;Observation Form&#39;:
          return `Use this structured observation form during &quot;${activity}&quot; to note observable ${level} behaviors, rate observed evidence (1–4), and capture concrete examples for feedback.`;
        case &#39;Rubric&#39;:
        default:
          return `Observe the student performing &quot;${activity}&quot; with ${level} expectations in mind. Select performance level 4, 3, 2, or 1 for each criterion based on observable evidence.`;
      }
    }

    function getScoringInstructionsByType(type, actualMaxPoints, criteriaCount) {
      switch (type) {
        case &#39;Checklist&#39;:
          return `Each of the ${criteriaCount} checklist items awards its full point value when Met (100%) or 0 points when Not Yet Met (0%). Total = ${actualMaxPoints} points. Percentage = (Points Earned ÷ ${actualMaxPoints}) × 100.`;
        case &#39;Rating Scale&#39;:
          return `Each item is rated from 1 to 4 on the rating scale and scaled to its point value (total: ${actualMaxPoints} points). Percentage = (Points Earned ÷ ${actualMaxPoints}) × 100. Bands: 85–100% = Excellent, 70–84% = Good, 50–69% = Developing, &lt;50% = Beginning.`;
        case &#39;Quiz&#39;:
          return `Select the achievement level corresponding to earned points for each item/criterion (total: ${actualMaxPoints} points). Percentage = (Points Earned ÷ ${actualMaxPoints}) × 100.`;
        case &#39;Observation Form&#39;:
          return `Record observed behaviors and rate evidence strength (1–4) scaled to each criterion&#39;s point value (total: ${actualMaxPoints} points). Percentage = (Points Earned ÷ ${actualMaxPoints}) × 100.`;
        case &#39;Rubric&#39;:
        default:
          return `Each criterion is rated from 1 (Beginning) to 4 (Excellent) and scaled proportionally to its maximum point value (total: ${actualMaxPoints} points). Percentage = (Points Earned ÷ ${actualMaxPoints}) × 100. Performance bands: 85–100% = Excellent, 70–84% = Good, 50–69% = Developing, below 50% = Beginning.`;
      }
    }

    /**
     * Generates observable performance descriptors for levels 4, 3, 2, and 1
     * tailored to the criterion topic, CEFR level, and English skill.
     */
    function generateDescriptorsForCriterion(criterionName, level, skill) {
      const lower = criterionName.toLowerCase();
      const skillText = skill.toLowerCase();

      if (lower.includes(&#39;vocabulary&#39;) || lower.includes(&#39;lexical&#39;)) {
        return {
          4: `Consistently uses accurate, varied ${level}-level vocabulary relevant to the task with natural word choice.`,
          3: `Uses appropriate ${level}-level vocabulary for most of the task with only minor word-choice slips.`,
          2: `Uses a limited set of familiar words; occasional repetition or missing terms affect clarity.`,
          1: `Relies on very limited or off-target vocabulary that frequently blocks task meaning.`
        };
      }

      if (lower.includes(&#39;time&#39;) || lower.includes(&#39;expression&#39;) || lower.includes(&#39;cohesion&#39;) || lower.includes(&#39;organization&#39;)) {
        return {
          4: `Organizes ideas logically and uses accurate time/linking expressions smoothly across the ${skillText} task.`,
          3: `Presents ideas in a clear sequence with mostly accurate time or linking expressions.`,
          2: `Shows basic order of ideas, but time markers or transitions are sometimes missing or imprecise.`,
          1: `Ideas appear disconnected with little or no use of appropriate time or organizational cues.`
        };
      }

      if (lower.includes(&#39;grammar&#39;) || lower.includes(&#39;accuracy&#39;) || lower.includes(&#39;language&#39;)) {
        return {
          4: `Demonstrates strong control of target ${level} structures; minor errors do not impede understanding.`,
          3: `Uses target structures with reasonable accuracy; some errors occur during more complex attempts.`,
          2: `Frequent grammar errors occur, though the main point remains understandable with effort.`,
          1: `Persistent structural errors make the ${skillText} output difficult to follow.`
        };
      }

      if (lower.includes(&#39;pronunciation&#39;) || lower.includes(&#39;intelligibility&#39;)) {
        return {
          4: `Pronunciation, word stress, and intonation are clear and natural, making speech easy to understand.`,
          3: `Generally intelligible throughout; occasional mispronounced words require brief listener adjustment.`,
          2: `Pronunciation or stress sometimes strains comprehension on unfamiliar or longer words.`,
          1: `Frequent pronunciation or intonation issues make understanding challenging for the listener.`
        };
      }

      if (lower.includes(&#39;fluency&#39;) || lower.includes(&#39;interaction&#39;)) {
        return {
          4: `Speaks/responds smoothly at a steady ${level} pace with natural pauses and effective task engagement.`,
          3: `Maintains steady momentum with occasional pauses to think or self-correct without losing flow.`,
          2: `Frequent hesitation or long pauses interrupt delivery, though the student completes key parts.`,
          1: `Very halting delivery or minimal response prevents smooth task progression.`
        };
      }

      return {
        4: `Fully meets &quot;${criterionName}&quot; at ${level} level with clear, consistent, and accurate evidence.`,
        3: `Meets &quot;${criterionName}&quot; satisfactorily with minor inconsistencies that do not block meaning.`,
        2: `Partially addresses &quot;${criterionName}&quot;; needs clearer control or more consistent application.`,
        1: `Shows minimal or no evidence of &quot;${criterionName}&quot; during the ${skillText} task.`
      };
    }

    /**
     * Converts selected rating/status into points for the active instrument type.
     * - Checklist: level 4 = full points (Met), level 1 = 0 points (Not Yet Met).
     * - Other 1–4 scales: proportional from 0% (level 1) to 100% (level 4).
     */
    function computeCriterionPoints(level, maxPoints, type = &#39;Rubric&#39;) {
      const parsed = Number(level);
      if (type === &#39;Checklist&#39;) {
        return parsed &gt;= 4 ? maxPoints : 0;
      }
      const clamped = Math.max(1, Math.min(4, parsed || 1));
      const ratio = (clamped - 1) / 3; // 0.0 for level 1, 1.0 for level 4
      return Math.round((ratio * maxPoints + Number.EPSILON) * 100) / 100;
    }

    function onCriterionLevelChange(criterionId, levelValue) {
      const parsedLevel = Number(levelValue);
      if (![1, 2, 3, 4].includes(parsedLevel)) return;

      const existing = appState.evaluations[criterionId] || { score: null, comment: &#39;&#39; };
      appState.evaluations[criterionId] = {
        score: parsedLevel,
        comment: existing.comment
      };

      const inst = getActiveInstrument();
      const crit = inst?.criteria.find((c) =&gt; c.id === criterionId);
      if (crit) {
        const pts = computeCriterionPoints(parsedLevel, crit.maxPoints, inst.type);
        const pill = document.getElementById(`crit-pts-pill-${criterionId}`);
        if (pill) {
          pill.textContent = `${formatScoreNumber(pts)} / ${crit.maxPoints} pts`;
        }
      }

      hideValidationErrors(&#39;evaluator-errors&#39;);
      recalculateScores();
      updateLiveSummary();
    }

    function onCriterionCommentChange(criterionId, commentText) {
      const existing = appState.evaluations[criterionId] || { score: null, comment: &#39;&#39; };
      appState.evaluations[criterionId] = {
        score: existing.score,
        comment: commentText
      };
      syncReportToCurrentState();
    }

    function calculateScoreSummary() {
      const inst = getActiveInstrument();
      if (!inst) {
        return { totalEarned: 0, maxPoints: 0, percentage: 0, levelLabel: &#39;Not Scored Yet&#39;, ratedCount: 0, totalCriteria: 0 };
      }

      let totalEarned = 0;
      let ratedCount = 0;

      inst.criteria.forEach((crit) =&gt; {
        const ev = appState.evaluations[crit.id];
        if (ev &amp;&amp; [1, 2, 3, 4].includes(Number(ev.score))) {
          totalEarned += computeCriterionPoints(Number(ev.score), crit.maxPoints, inst.type);
          ratedCount += 1;
        }
      });

      const roundedEarned = Math.round((totalEarned + Number.EPSILON) * 100) / 100;
      const maxPoints = inst.totalPoints;
      const percentage = maxPoints &gt; 0 ? Math.round((roundedEarned / maxPoints) * 100) : 0;

      let levelLabel = &#39;Not Scored Yet&#39;;
      if (ratedCount &gt; 0) {
        if (percentage &gt;= 85) levelLabel = &#39;4 – Excellent&#39;;
        else if (percentage &gt;= 70) levelLabel = &#39;3 – Good&#39;;
        else if (percentage &gt;= 50) levelLabel = &#39;2 – Developing&#39;;
        else levelLabel = &#39;1 – Beginning&#39;;
      }

      return {
        totalEarned: roundedEarned,
        maxPoints,
        percentage,
        levelLabel,
        ratedCount,
        totalCriteria: inst.criteria.length
      };
    }

    function recalculateScores() {
      const summary = calculateScoreSummary();
      document.getElementById(&#39;live-total-points&#39;).textContent = formatScoreNumber(summary.totalEarned);
      document.getElementById(&#39;live-max-points&#39;).textContent = String(summary.maxPoints);
      document.getElementById(&#39;live-percentage&#39;).textContent = `${summary.percentage}%`;

      const badge = document.getElementById(&#39;live-performance-badge&#39;);
      badge.textContent = summary.levelLabel;

      if (summary.ratedCount === 0) {
        badge.className = &#39;inline-block mt-1 px-3 py-1 rounded-full text-xs sm:text-sm font-bold bg-slate-200 text-slate-700&#39;;
      } else if (summary.percentage &gt;= 85) {
        badge.className = &#39;inline-block mt-1 px-3 py-1 rounded-full text-xs sm:text-sm font-bold bg-blue-700 text-white&#39;;
      } else if (summary.percentage &gt;= 70) {
        badge.className = &#39;inline-block mt-1 px-3 py-1 rounded-full text-xs sm:text-sm font-bold bg-blue-100 text-blue-900&#39;;
      } else if (summary.percentage &gt;= 50) {
        badge.className = &#39;inline-block mt-1 px-3 py-1 rounded-full text-xs sm:text-sm font-bold bg-amber-100 text-amber-900&#39;;
      } else {
        badge.className = &#39;inline-block mt-1 px-3 py-1 rounded-full text-xs sm:text-sm font-bold bg-red-100 text-red-900&#39;;
      }

      const bar = document.getElementById(&#39;live-progress-bar&#39;);
      const clampedPct = Math.max(0, Math.min(100, summary.percentage));
      bar.style.width = `${clampedPct}%`;

      const hint = document.getElementById(&#39;completion-status-hint&#39;);
      if (hint) {
        const unitLabel = getActiveInstrument()?.type === &#39;Checklist&#39; ? &#39;items&#39; : &#39;criteria&#39;;
        hint.textContent = `Rated ${summary.ratedCount} of ${summary.totalCriteria} ${unitLabel}.`;
      }

      syncReportToCurrentState();
    }

    function formatScoreNumber(num) {
      return Number.isInteger(num) ? String(num) : num.toFixed(1);
    }

    function resetEvaluationForm(clearName = false) {
      appState.evaluations = {};
      appState.editingRecordId = null;
      if (clearName) {
        document.getElementById(&#39;eval-student-name&#39;).value = &#39;&#39;;
      }
      hideValidationErrors(&#39;evaluator-errors&#39;);
      const inst = getActiveInstrument();
      if (inst) {
        renderEvaluationCriteria(inst);
      }
      recalculateScores();
      regenerateFeedbackFromCurrentScores();
      syncReportToCurrentState();
      updateLiveSummary();
      showBanner(&#39;Evaluation scores have been reset.&#39;, &#39;info&#39;);
    }

    /**
     * =========================================================================
     * SECTION C: PERSONALIZED FEEDBACK GENERATOR
     * =========================================================================
     */
    function generateAndSaveEvaluation() {
      const studentName = document.getElementById(&#39;eval-student-name&#39;).value.trim();
      const inst = getActiveInstrument();
      const errors = [];

      if (!studentName) {
        errors.push(&#39;Please enter the student\&#39;s name before completing the evaluation.&#39;);
      }

      if (inst) {
        const unrated = inst.criteria.filter((c) =&gt; {
          const ev = appState.evaluations[c.id];
          return !ev || ![1, 2, 3, 4].includes(Number(ev.score));
        });
        if (unrated.length &gt; 0) {
          const promptAction = inst.type === &#39;Checklist&#39;
            ? &#39;select Met or Not Yet Met for all checklist items&#39;
            : &#39;select a score level for all criteria&#39;;
          errors.push(`Please ${promptAction} (${unrated.length} remaining).`);
        }
      }

      if (errors.length &gt; 0) {
        showValidationErrors(&#39;evaluator-errors&#39;, &#39;evaluator-error-list&#39;, errors);
        return;
      }

      hideValidationErrors(&#39;evaluator-errors&#39;);
      regenerateFeedbackFromCurrentScores();
      saveCurrentEvaluationToSession();
      syncReportToCurrentState();
      updateLiveSummary();

      showBanner(`Assessment completed and feedback generated for ${studentName}.`, &#39;success&#39;);
      navigateToSection(&#39;section-feedback&#39;);
    }

    function regenerateFeedbackFromCurrentScores() {
      const inst = getActiveInstrument();
      if (!inst) return;

      const studentName = document.getElementById(&#39;eval-student-name&#39;).value.trim() || &#39;the student&#39;;
      const ratedItems = inst.criteria
        .map((crit) =&gt; {
          const ev = appState.evaluations[crit.id];
          const score = ev &amp;&amp; [1, 2, 3, 4].includes(Number(ev.score)) ? Number(ev.score) : null;
          return {
            criterion: crit,
            score,
            comment: ev?.comment?.trim() || &#39;&#39;
          };
        })
        .filter((item) =&gt; item.score !== null);

      const strengthsEl = document.getElementById(&#39;fb-strengths&#39;);
      const improvementsEl = document.getElementById(&#39;fb-improvements&#39;);
      const recommendationEl = document.getElementById(&#39;fb-recommendation&#39;);
      const closingEl = document.getElementById(&#39;fb-closing&#39;);

      if (ratedItems.length === 0) {
        strengthsEl.value = `Select performance levels above to generate tailored strengths for ${studentName} at ${inst.level} level.`;
        improvementsEl.value = `Specific focus areas based on ${inst.title} criteria will appear once criteria are scored.`;
        recommendationEl.value = `Practice ${inst.skill.toLowerCase()} tasks aligned with: &quot;${inst.objective}&quot;`;
        closingEl.value = `Great effort getting started—every step in ${inst.level} English builds confidence!`;
        syncFeedbackToReport();
        return;
      }

      // Identify strongest and lowest-scoring criteria
      const sortedDesc = [...ratedItems].sort((a, b) =&gt; b.score - a.score);
      const sortedAsc = [...ratedItems].sort((a, b) =&gt; a.score - b.score);

      const highItems = sortedDesc.filter((i) =&gt; i.score &gt;= 3);
      const topList = (highItems.length &gt; 0 ? highItems : [sortedDesc[0]]).slice(0, 2);

      const lowItems = sortedAsc.filter((i) =&gt; i.score &lt;= 2);
      const focusList = (lowItems.length &gt; 0 ? lowItems : [sortedAsc[0]]).slice(0, 2);

      const topNames = topList.map((i) =&gt; `${i.criterion.name} (${LEVEL_LABELS[i.score]})`).join(&#39; and &#39;);
      const topNotes = topList.map((i) =&gt; i.comment).filter(Boolean).join(&#39;; &#39;);
      strengthsEl.value =
        `${studentName} showed strong performance in ${topNames} during &quot;${inst.title}&quot; (${inst.level} ${inst.skill}).` +
        (topNotes ? ` Classroom observation: ${topNotes}.` : &#39;&#39;);

      const focusNames = focusList.map((i) =&gt; `${i.criterion.name} (${i.score}/4 – ${LEVEL_LABELS[i.score]})`).join(&#39; and &#39;);
      const focusNotes = focusList.map((i) =&gt; i.comment).filter(Boolean).join(&#39;; &#39;);
      improvementsEl.value =
        `Priority focus for ${studentName} is ${focusNames}, which will directly support the objective: &quot;${inst.objective}&quot;` +
        (focusNotes ? ` Note: ${focusNotes}.` : &#39;&#39;);

      const primaryFocus = focusList[0].criterion.name.toLowerCase();
      recommendationEl.value = buildPracticalRecommendation(primaryFocus, inst.level, inst.skill, inst.title);

      const summary = calculateScoreSummary();
      if (summary.percentage &gt;= 85) {
        closingEl.value = `Outstanding work, ${studentName}! You met ${inst.level} expectations with clarity and confidence—keep challenging yourself with new ${inst.skill.toLowerCase()} tasks.`;
      } else if (summary.percentage &gt;= 70) {
        closingEl.value = `Solid progress, ${studentName}! You are communicating well at ${inst.level} level—applying this one tip will help you reach an even higher score next time.`;
      } else {
        closingEl.value = `Keep going, ${studentName}! Learning ${inst.level} English takes steady practice, and you already have a foundation to build on in our next activity.`;
      }

      syncFeedbackToReport();
    }

    function buildPracticalRecommendation(focusLower, level, skill, title) {
      if (focusLower.includes(&#39;vocabulary&#39;)) {
        return `Before your next &quot;${title}&quot; ${skill.toLowerCase()} task, write down 6–8 key ${level} words or phrases and say each one aloud in a short sentence.`;
      }
      if (focusLower.includes(&#39;time&#39;) || focusLower.includes(&#39;expression&#39;) || focusLower.includes(&#39;organization&#39;)) {
        return `Make a 3-step outline with clear time or sequence markers (such as &quot;in the morning,&quot; &quot;after that,&quot; or &quot;at night&quot;) before you begin speaking or writing.`;
      }
      if (focusLower.includes(&#39;grammar&#39;)) {
        return `Pick one target ${level} grammar pattern for the activity and check your sentences for verb endings or word order during a quick 30-second review.`;
      }
      if (focusLower.includes(&#39;pronunciation&#39;)) {
        return `Record yourself doing a short ${level} practice run and replay it once to check if key words and stress sound clear.`;
      }
      return `Do one short, untimed ${level} warm-up focused on &quot;${focusLower}&quot; before presenting so your ideas feel more familiar and natural.`;
    }

    function syncFeedbackToReport() {
      document.getElementById(&#39;report-fb-strengths&#39;).textContent = document.getElementById(&#39;fb-strengths&#39;).value;
      document.getElementById(&#39;report-fb-improvements&#39;).textContent = document.getElementById(&#39;fb-improvements&#39;).value;
      document.getElementById(&#39;report-fb-recommendation&#39;).textContent = document.getElementById(&#39;fb-recommendation&#39;).value;
      document.getElementById(&#39;report-fb-closing&#39;).textContent = document.getElementById(&#39;fb-closing&#39;).value;
    }

    /**
     * =========================================================================
     * SECTION D: RESULTS DASHBOARD, SESSION HISTORY &amp; EXPORT
     * =========================================================================
     */
    function saveCurrentEvaluationToSession() {
      const inst = getActiveInstrument();
      if (!inst) return;

      const studentName = document.getElementById(&#39;eval-student-name&#39;).value.trim();
      const date = document.getElementById(&#39;eval-date&#39;).value || new Date().toISOString().split(&#39;T&#39;)[0];
      const summary = calculateScoreSummary();

      const record = {
        id: appState.editingRecordId || (&#39;rec-&#39; + Date.now()),
        studentName,
        date,
        instrumentId: inst.id,
        instrumentTitle: inst.title,
        level: inst.level,
        grade: inst.grade,
        skill: inst.skill,
        type: inst.type,
        objective: inst.objective,
        criteria: inst.criteria.map((c) =&gt; ({
          id: c.id,
          name: c.name,
          maxPoints: c.maxPoints,
          score: Number(appState.evaluations[c.id]?.score || 1),
          earnedPoints: computeCriterionPoints(Number(appState.evaluations[c.id]?.score || 1), c.maxPoints, inst.type),
          comment: appState.evaluations[c.id]?.comment || &#39;&#39;
        })),
        totalEarned: summary.totalEarned,
        maxPoints: summary.maxPoints,
        percentage: summary.percentage,
        levelLabel: summary.levelLabel,
        feedback: {
          strengths: document.getElementById(&#39;fb-strengths&#39;).value,
          improvements: document.getElementById(&#39;fb-improvements&#39;).value,
          recommendation: document.getElementById(&#39;fb-recommendation&#39;).value,
          closing: document.getElementById(&#39;fb-closing&#39;).value
        }
      };

      const existingIdx = appState.savedRecords.findIndex((r) =&gt; r.id === record.id);
      if (existingIdx &gt;= 0) {
        appState.savedRecords[existingIdx] = record;
      } else {
        appState.savedRecords.unshift(record);
      }
      appState.editingRecordId = record.id;

      renderSavedRecordsTable();
    }

    function renderSavedRecordsTable() {
      const tbody = document.getElementById(&#39;saved-records-tbody&#39;);
      if (!tbody) return;

      if (appState.savedRecords.length === 0) {
        tbody.innerHTML = `
          &lt;tr&gt;
            &lt;td colspan=&quot;5&quot; class=&quot;py-5 px-4 text-center text-slate-500 text-sm&quot;&gt;
              No completed assessments saved yet. Complete an evaluation and click &quot;Complete &amp;amp; Generate Feedback&quot;.
            &lt;/td&gt;
          &lt;/tr&gt;
        `;
        return;
      }

      tbody.innerHTML = appState.savedRecords.map((rec) =&gt; `
        &lt;tr class=&quot;hover:bg-slate-50/80&quot;&gt;
          &lt;td class=&quot;py-3 px-3.5 font-semibold text-slate-900&quot;&gt;${escapeHtml(rec.studentName)}&lt;/td&gt;
          &lt;td class=&quot;py-3 px-3.5 text-slate-700&quot;&gt;${escapeHtml(rec.instrumentTitle)} (${escapeHtml(rec.level)})&lt;/td&gt;
          &lt;td class=&quot;py-3 px-3.5 font-semibold text-blue-900&quot;&gt;${formatScoreNumber(rec.totalEarned)} / ${rec.maxPoints} (${rec.percentage}%)&lt;/td&gt;
          &lt;td class=&quot;py-3 px-3.5 text-slate-700&quot;&gt;${escapeHtml(rec.levelLabel)}&lt;/td&gt;
          &lt;td class=&quot;py-3 px-3.5 text-right&quot;&gt;
            &lt;button
              type=&quot;button&quot;
              onclick=&quot;loadSavedRecord(&#39;${escapeHtml(rec.id)}&#39;)&quot;
              class=&quot;text-xs font-semibold text-blue-700 hover:text-blue-900 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg transition-colors&quot;
            &gt;
              Load
            &lt;/button&gt;
          &lt;/td&gt;
        &lt;/tr&gt;
      `).join(&#39;&#39;);
    }

    function loadSavedRecord(recordId) {
      const rec = appState.savedRecords.find((r) =&gt; r.id === recordId);
      if (!rec) return;

      // Ensure instrument is active
      let inst = appState.instruments.find((i) =&gt; i.id === rec.instrumentId);
      if (!inst) {
        inst = buildInstrumentObject({
          id: rec.instrumentId,
          title: rec.instrumentTitle,
          level: rec.level,
          grade: rec.grade,
          skill: rec.skill,
          activity: rec.instrumentTitle,
          objective: rec.objective,
          type: rec.type,
          totalPoints: rec.maxPoints,
          criteriaNames: rec.criteria.map((c) =&gt; c.name)
        });
        appState.instruments.unshift(inst);
      }

      appState.activeInstrumentId = inst.id;
      appState.editingRecordId = rec.id;
      appState.evaluations = {};

      rec.criteria.forEach((c, idx) =&gt; {
        const targetCrit = inst.criteria[idx];
        if (targetCrit) {
          appState.evaluations[targetCrit.id] = {
            score: c.score,
            comment: c.comment
          };
        }
      });

      document.getElementById(&#39;eval-student-name&#39;).value = rec.studentName;
      document.getElementById(&#39;eval-date&#39;).value = rec.date;

      document.getElementById(&#39;fb-strengths&#39;).value = rec.feedback.strengths;
      document.getElementById(&#39;fb-improvements&#39;).value = rec.feedback.improvements;
      document.getElementById(&#39;fb-recommendation&#39;).value = rec.feedback.recommendation;
      document.getElementById(&#39;fb-closing&#39;).value = rec.feedback.closing;

      renderGeneratedInstrument(inst);
      refreshInstrumentDropdown();
      renderEvaluationCriteria(inst);
      recalculateScores();
      syncFeedbackToReport();
      updateLiveSummary();

      showBanner(`Loaded assessment record for ${rec.studentName}.`, &#39;info&#39;);
      navigateToSection(&#39;section-evaluator&#39;);
    }

    function prepareNextStudent() {
      appState.evaluations = {};
      appState.editingRecordId = null;
      document.getElementById(&#39;eval-student-name&#39;).value = &#39;&#39;;
      hideValidationErrors(&#39;evaluator-errors&#39;);

      const inst = getActiveInstrument();
      if (inst) {
        renderEvaluationCriteria(inst);
      }
      recalculateScores();
      regenerateFeedbackFromCurrentScores();
      syncReportToCurrentState();
      updateLiveSummary();

      showBanner(&#39;Form cleared for the next student.&#39;, &#39;info&#39;);
      navigateToSection(&#39;section-evaluator&#39;);
      setTimeout(() =&gt; {
        document.getElementById(&#39;eval-student-name&#39;)?.focus();
      }, 250);
    }

    function syncReportToCurrentState() {
      const inst = getActiveInstrument();
      if (!inst) return;

      const studentName = document.getElementById(&#39;eval-student-name&#39;).value.trim() || &#39;—&#39;;
      const dateVal = document.getElementById(&#39;eval-date&#39;).value || &#39;—&#39;;
      const summary = calculateScoreSummary();

      document.getElementById(&#39;report-assessment-title&#39;).textContent = inst.title;
      document.getElementById(&#39;report-learning-objective&#39;).textContent = inst.objective;
      document.getElementById(&#39;report-student-name&#39;).textContent = studentName;
      document.getElementById(&#39;report-level-grade&#39;).textContent = `${inst.level} · ${inst.grade}`;
      document.getElementById(&#39;report-skill-type&#39;).textContent = `${inst.skill} · ${inst.type}`;
      document.getElementById(&#39;report-date&#39;).textContent = dateVal;
      document.getElementById(&#39;report-score-summary&#39;).textContent =
        `${formatScoreNumber(summary.totalEarned)} / ${summary.maxPoints} pts (${summary.percentage}%)`;
      document.getElementById(&#39;report-level-summary&#39;).textContent = summary.levelLabel;

      const tbody = document.getElementById(&#39;report-criteria-tbody&#39;);
      tbody.innerHTML = inst.criteria.map((crit) =&gt; {
        const ev = appState.evaluations[crit.id];
        const hasScore = ev &amp;&amp; [1, 2, 3, 4].includes(Number(ev.score));
        const lvl = hasScore ? Number(ev.score) : null;
        const pts = hasScore ? computeCriterionPoints(lvl, crit.maxPoints, inst.type) : 0;
        let levelText = &#39;Not rated&#39;;
        if (hasScore) {
          if (inst.type === &#39;Checklist&#39;) {
            levelText = lvl &gt;= 4 ? &#39;Met&#39; : &#39;Not Yet Met&#39;;
          } else if (inst.type === &#39;Rating Scale&#39;) {
            levelText = RATING_SCALE_LABELS[lvl];
          } else {
            levelText = `${lvl} – ${LEVEL_LABELS[lvl]}`;
          }
        }
        const noteText = ev?.comment?.trim() ? ev.comment.trim() : &#39;—&#39;;

        return `
          &lt;tr&gt;
            &lt;td class=&quot;py-2.5 px-3 font-medium text-slate-900&quot;&gt;${escapeHtml(crit.name)}&lt;/td&gt;
            &lt;td class=&quot;py-2.5 px-3 text-slate-700&quot;&gt;${escapeHtml(levelText)}&lt;/td&gt;
            &lt;td class=&quot;py-2.5 px-3 text-slate-600&quot;&gt;${escapeHtml(noteText)}&lt;/td&gt;
            &lt;td class=&quot;py-2.5 px-3 font-semibold text-blue-950 text-right whitespace-nowrap&quot;&gt;
              ${formatScoreNumber(pts)} / ${crit.maxPoints}
            &lt;/td&gt;
          &lt;/tr&gt;
        `;
      }).join(&#39;&#39;);
    }

    function updateLiveSummary() {
      const inst = getActiveInstrument();
      const studentName = document.getElementById(&#39;eval-student-name&#39;).value.trim();
      const summary = calculateScoreSummary();

      if (inst) {
        document.getElementById(&#39;summary-title&#39;).textContent = inst.title;
        document.getElementById(&#39;summary-meta&#39;).textContent = `${inst.level} · ${inst.skill} · ${inst.type}`;
        document.getElementById(&#39;summary-criteria-count&#39;).textContent =
          `${inst.criteria.length} criteria · ${inst.totalPoints} pts max`;
      }

      document.getElementById(&#39;summary-student&#39;).textContent = studentName || &#39;Not entered yet&#39;;
      document.getElementById(&#39;summary-score&#39;).textContent =
        `${formatScoreNumber(summary.totalEarned)} / ${summary.maxPoints} pts (${summary.percentage}%)`;
      document.getElementById(&#39;summary-level&#39;).textContent = summary.levelLabel;
      document.getElementById(&#39;summary-saved-count&#39;).textContent =
        `${appState.savedRecords.length} ${appState.savedRecords.length === 1 ? &#39;record&#39; : &#39;records&#39;}`;
    }

    function exportSummaryText() {
      try {
        const inst = getActiveInstrument();
        const studentName = document.getElementById(&#39;eval-student-name&#39;).value.trim() || &#39;Student&#39;;
        const dateVal = document.getElementById(&#39;eval-date&#39;).value || &#39;&#39;;
        const summary = calculateScoreSummary();

        const lines = [
          `ELT ASSESSMENT REPORT`,
          `Assessment: ${inst?.title || &#39;&#39;} (${inst?.level || &#39;&#39;}, ${inst?.skill || &#39;&#39;})`,
          `Student: ${studentName} | Date: ${dateVal}`,
          `Score: ${formatScoreNumber(summary.totalEarned)} / ${summary.maxPoints} (${summary.percentage}%) - ${summary.levelLabel}`,
          ``,
          `Criteria Breakdown:`
        ];

        inst?.criteria.forEach((crit) =&gt; {
          const ev = appState.evaluations[crit.id];
          const lvl = ev &amp;&amp; [1, 2, 3, 4].includes(Number(ev.score)) ? Number(ev.score) : null;
          const pts = lvl ? computeCriterionPoints(lvl, crit.maxPoints, inst?.type) : 0;
          let lvlStr = &#39;Not rated&#39;;
          if (lvl) {
            if (inst?.type === &#39;Checklist&#39;) lvlStr = lvl &gt;= 4 ? &#39;Met&#39; : &#39;Not Yet Met&#39;;
            else if (inst?.type === &#39;Rating Scale&#39;) lvlStr = RATING_SCALE_LABELS[lvl];
            else lvlStr = `${lvl} - ${LEVEL_LABELS[lvl]}`;
          }
          lines.push(`- ${crit.name}: ${lvlStr} (${formatScoreNumber(pts)}/${crit.maxPoints} pts)${ev?.comment ? ` | Note: ${ev.comment}` : &#39;&#39;}`);
        });

        lines.push(
          ``,
          `Strengths: ${document.getElementById(&#39;fb-strengths&#39;).value}`,
          `Areas for Improvement: ${document.getElementById(&#39;fb-improvements&#39;).value}`,
          `Practical Recommendation: ${document.getElementById(&#39;fb-recommendation&#39;).value}`,
          `Closing Comment: ${document.getElementById(&#39;fb-closing&#39;).value}`
        );

        const textToCopy = lines.join(&#39;\n&#39;);
        const helper = document.createElement(&#39;textarea&#39;);
        helper.value = textToCopy;
        helper.setAttribute(&#39;readonly&#39;, &#39;&#39;);
        helper.style.position = &#39;absolute&#39;;
        helper.style.left = &#39;-9999px&#39;;
        document.body.appendChild(helper);
        helper.select();
        document.execCommand(&#39;copy&#39;);
        document.body.removeChild(helper);

        showBanner(&#39;Assessment summary copied to clipboard.&#39;, &#39;success&#39;);
      } catch (err) {
        console.error(&#39;Copy failed:&#39;, err);
        showBanner(&#39;Unable to copy automatically. You can print or save the report as PDF instead.&#39;, &#39;error&#39;);
      }
    }

    function printReport() {
      syncReportToCurrentState();
      window.print();
    }

    /**
     * =========================================================================
     * VALIDATION HELPERS
     * =========================================================================
     */
    function showValidationErrors(boxId, listId, messages) {
      const box = document.getElementById(boxId);
      const list = document.getElementById(listId);
      if (!box || !list) return;

      list.innerHTML = messages.map((msg) =&gt; `&lt;li&gt;${escapeHtml(msg)}&lt;/li&gt;`).join(&#39;&#39;);
      box.classList.remove(&#39;hidden&#39;);
      box.scrollIntoView({ behavior: &#39;smooth&#39;, block: &#39;nearest&#39; });
    }

    function hideValidationErrors(boxId) {
      const box = document.getElementById(boxId);
      if (box) {
        box.classList.add(&#39;hidden&#39;);
      }
    }
